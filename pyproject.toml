[project]
name = "paper-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["scholar-workflow-pdfx>=0.1.0,<0.2"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/runtime/ hosts the PA-CODEX-FULL-LEAF-01 topology verifier; it ships
# with the producer repo only and must never re-enter the packaged skill tree.
pythonpath = ["tests/runtime"]
