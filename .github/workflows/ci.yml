name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - name: Refresh lock for pytest dev dependency
        run: uv lock
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run pytest suite
        run: uv run pytest -q
      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: generated-uv-lock
          path: uv.lock
